name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: head
        name: Skip if main has moved on
        shell: bash
        env:
          TESTED: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$latest" != "$TESTED" ]; then
            echo "::notice::main moved on to ${latest:0:7}, which deploys after its own CI"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.superseded != 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build
        if: steps.head.outputs.superseded != 'true'
        run: pnpm build
      - name: Deploy
        if: steps.head.outputs.superseded != 'true'
        run: pnpm --filter @strix/worker exec wrangler d1 migrations apply strix --remote && pnpm --filter @strix/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
